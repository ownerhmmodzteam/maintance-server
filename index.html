<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maintenance Server</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #f2f2f7;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            background-image: radial-gradient(circle at center, #1c1c1e 0%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            color: white;
            overflow: hidden;
        }

        .card {
            width: 85%;
            max-width: 320px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .icon-container {
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .gear {
            font-size: 50px;
            animation: rotate 4s linear infinite;
            display: inline-block;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 10px 0;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--ios-blue);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .footer-info {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <span class="gear">⚙️</span>
        </div>
        <h1>Maintenance Server</h1>
        <p>Server <b>Film Stream</b> sedang di perbaiki agar stream lebih lancar tanpa kendala. Sabar ya bro!</p>
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="footer-info">HM MODZ TEAM SERVER V2.0</div>

</body>
</html>
