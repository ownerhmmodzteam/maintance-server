<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Server Maintenance - HM MODZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-secondary: #0a0a0a;
            --accent-blue: #007aff;
            --accent-blue-light: #2b8fff;
            --accent-orange: #ff9500;
            --accent-red: #ff3b30;
            --text-primary: rgba(255, 255, 255, 1);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Effects */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .bg-gradient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            z-index: 0;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: var(--accent-blue);
            top: -15%;
            right: -10%;
            animation: float-blob 12s ease-in-out infinite;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: var(--accent-orange);
            bottom: -5%;
            left: -15%;
            animation: float-blob 14s ease-in-out infinite reverse;
        }

        @keyframes float-blob {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, -50px); }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 550px;
            padding: 56px 48px;
            border-radius: 40px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            border: 1px solid var(--border-glass);
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--border-glass-hover);
            animation: container-fade 0.9s cubic-bezier(0.2, 1, 0.2, 1);
            text-align: center;
        }

        @keyframes container-fade {
            from {
                opacity: 0;
                transform: scale(0.93) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 1.5px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-orange) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.4;
            animation: border-shimmer 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes border-shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.15), rgba(255, 149, 0, 0.05));
            border: 1px solid rgba(255, 149, 0, 0.3);
            color: var(--accent-orange);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
            animation: badge-pulse 2s ease-in-out infinite;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-orange);
            animation: dot-pulse 2s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes dot-pulse {
            0%, 100% { 
                opacity: 0.4;
                box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.7);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 0 6px rgba(255, 149, 0, 0);
            }
        }

        /* Icon */
        .icon {
            font-size: 80px;
            margin-bottom: 28px;
            display: inline-block;
            animation: icon-float 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            filter: drop-shadow(0 0 20px rgba(255, 149, 0, 0.3));
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* Heading */
        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1.2px;
            line-height: 1.15;
            background: linear-gradient(180deg, #ffffff 0%, #ffffff 70%, var(--accent-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Description */
        .description {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        /* Maintenance Progress */
        .maintenance-progress {
            margin-bottom: 40px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
        }

        .progress-label {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-blue-light), var(--accent-orange));
            border-radius: 10px;
            animation: progress-animate 2s ease-in-out infinite;
        }

        @keyframes progress-animate {
            0% { width: 30%; }
            50% { width: 70%; }
            100% { width: 30%; }
        }

        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            text-align: center;
        }

        /* Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-light));
            color: white;
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 122, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-glass-hover);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                width: 92%;
                max-width: 100%;
                padding: 40px 28px;
                border-radius: 32px;
            }

            h1 {
                font-size: 32px;
            }

            .icon {
                font-size: 64px;
                margin-bottom: 20px;
            }

            .description {
                font-size: 14px;
            }

            .maintenance-timer {
                gap: 12px;
                padding: 16px;
            }

            .timer-value {
                font-size: 24px;
            }

            .button-group {
                gap: 10px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 13px;
            }
        }

        /* Utility */
        .divider {
            height: 1px;
            background: var(--border-glass);
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <!-- Background Blobs -->
    <div class="bg-gradient-blob blob-1"></div>
    <div class="bg-gradient-blob blob-2"></div>

    <!-- Particles -->
    <div id="particles-js"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Status Badge -->
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Server Maintenance</span>
        </div>

        <!-- Icon -->
        <div class="icon">🔧</div>

        <!-- Title -->
        <h1>Server Sedang<br>Dalam Pemeliharan Server</h1>

        <!-- Description -->
        <p class="description">
            Kami sedang melakukan pemeliharaan sistem untuk memberikan layanan yang lebih baik.
        </p>

        <!-- Maintenance Progress -->
        <div class="maintenance-progress">
            <div class="progress-label">Status Perbaikan</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">Sistem sedang diperbarui dan diperbaiki...</div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Buttons -->
        <div class="button-group">
            <a href="https://t.me/hanzdevhmmodz" class="btn btn-primary">Hubungi Admin</a>
            <a href="javascript:location.reload()" class="btn btn-secondary">Refresh Aplikasi</a>
        </div>
    </div>

    <!-- Particles JS -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Initialize Particles
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 1000
                    }
                },
                "color": {
                    "value": ["#007aff", "#ff9500"]
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.4,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 0.8,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 4,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 180,
                    "color": "#007aff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.5,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 200,
                        "line_linked": {
                            "opacity": 0.5
                        }
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });

        // Refresh particles on window resize
        window.addEventListener('resize', () => {
            if (window.pJSDom && window.pJSDom[0]) {
                window.pJSDom[0].pJS.canvas.pJS.canvas.width = window.innerWidth;
                window.pJSDom[0].pJS.canvas.pJS.canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
